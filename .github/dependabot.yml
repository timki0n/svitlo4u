version: 2
updates:
  # Infra images (cloudflared, zigbee2mqtt, mosquitto): checked daily so the tunnel stays on the latest release.
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: daily
      time: "06:00"
      timezone: Europe/Kyiv

  - package-ecosystem: docker
    directory: /apps/core
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tooling:
        dependency-type: development
      runtime-minor:
        dependency-type: production
        update-types: [minor, patch]
