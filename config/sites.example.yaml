# Copy to config/sites.yaml on the server. Secrets are NOT stored here: each device and bot names
# the environment variable (deploy/.env) that holds its key.
sites:
  - id: 4u
    name: ЖК 4U
    tz: Europe/Kyiv
    linkUrl: https://svitlo4u.info
    yasno: { region: 25, dso: 902, group: "12.1" }
    devices:
      - id: esp-4u
        kind: esp
        transport: udp # signed v2 packets, see docs/esp-protocol.md
        secretEnv: ESP_4U_SECRET
        legacyIps: ["192.168.0.225"] # accept unsigned {"ping":N} until the firmware is updated
      - id: 4u-plug
        kind: plug
        zigbeeName: 4u-plug
    # detector:                  # optional overrides of DEFAULT_DETECTOR_CONFIG
    #   suspectAfterMs: 5000
    telegram:
      botTokenEnv: TG_4U_TOKEN # bot from @BotFather; one bot per site
      adminChatId: 123456789 # alerts, /status log, /health /stats /notify
      shadow: true # until switch-over: announcements only to the admin chat, with latency
      chats: ["-1001234567890", "-1001234567890_12"] # chat id, or chatId_topicId for a forum topic
      blockedChats: [] # commands here are deleted and ignored
      silentChats: ["-1001234567890_12"] # non-admin messages here are deleted
      # logStatusRequests: true    # copy every /status request to the admin chat

  - id: g6
    name: Група 6.1
    yasno: { region: 25, dso: 902, group: "6.1" }
    devices:
      - id: esp-g6
        kind: esp
        transport: http # POST /iot/ping with X-Signature (light_bot_tg firmware)
        secretEnv: ESP_G6_SECRET
    # telegram:
    #   botTokenEnv: TG_G6_TOKEN   # the light_bot_tg bot keeps its /sub subscribers
    #   commands: false            # send only, while light_bot_tg still owns the bot's webhook
